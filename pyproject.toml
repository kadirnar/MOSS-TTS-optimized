[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "moss-tts-optimized"
version = "0.3.0"
description = "MOSS-TTS v1.5 8B streaming inference with voice cloning and Triton/CUDA kernels"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "src/moss_tts/_licenses/*"]
authors = [{name = "kadirnar", email = "kadir.nar@hotmail.com"}]
keywords = ["tts", "voice-cloning", "streaming", "triton", "cuda"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "torch>=2.9,<2.14",
  "torchaudio>=2.9,<2.14",
  "triton>=3.5,<3.9",
  "transformers==5.14.1",
  "accelerate>=1.12,<2",
  "huggingface-hub>=1.5,<2",
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "safetensors>=0.6,<1",
  "tqdm>=4.67,<5",
]

[project.optional-dependencies]
hopper = ["torch==2.13.0", "triton==3.7.1"]
server = ["fastapi>=0.136,<1", "uvicorn>=0.53,<1"]
dev = ["build>=1.2", "pytest>=8", "httpx>=0.28", "ruff>=0.11"]

[project.scripts]
moss-tts = "moss_tts.cli:main"

[project.urls]
Repository = "https://github.com/kadirnar/moss-tts-optimized"
"Original model" = "https://huggingface.co/OpenMOSS-Team/MOSS-TTS-v1.5"

[tool.setuptools.packages.find]
where = ["src"]
include = ["moss_tts*"]

[tool.setuptools.package-data]
moss_tts = ["py.typed", "_runtime/*.cu", "_assets/*.json", "_assets/*/*.json", "_assets/*/*.cubin", "_licenses/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["gpu: requires the full 8B checkpoint and an NVIDIA GPU"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/moss_tts/_runtime", "src/moss_tts/_model", "src/moss_tts/_codec"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
