# vLLM-Omni 0.28 with its compatible vLLM 0.28, full codebooks, small chunks.
async_chunk: true
trust_remote_code: true
connectors:
  shm:
    name: SharedMemoryConnector
    extra:
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 1
      initial_codec_chunk_frames: 1
      codec_left_context_frames: 0
      decode_cudagraph_capture_sizes: [1, 2, 4, 8, 16, 32]
stages:
  - stage_id: 0
    hf_overrides:
      codec_model_name_or_path: /workspace/models/moss-codec
      audio_tokenizer_name_or_path: /workspace/models/moss-codec
    max_num_seqs: 1
    gpu_memory_utilization: 0.40
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 1024
    max_model_len: 1024
    devices: "0"
    output_connectors:
      to_stage_1: shm
    default_sampling_params:
      temperature: 1.7
      top_p: 0.8
      top_k: 25
      max_tokens: 400
      seed: 1234
      repetition_penalty: 1.0
      stop_token_ids: [151645]
  - stage_id: 1
    hf_overrides:
      codec_model_name_or_path: /workspace/models/moss-codec
      audio_tokenizer_name_or_path: /workspace/models/moss-codec
    max_num_seqs: 1
    gpu_memory_utilization: 0.10
    # This engine explicitly converts its CUDA codec decoder/LUT to BF16.
    dtype: bfloat16
    enforce_eager: false
    enable_prefix_caching: false
    async_scheduling: true
    max_num_batched_tokens: 32768
    max_model_len: 32768
    devices: "0"
    input_connectors:
      from_stage_0: shm
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 32768
      seed: 1234
      repetition_penalty: 1.0
